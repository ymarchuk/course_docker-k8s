apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: strimzi-operator
  namespace: strimzi-system
spec:
  interval: 1h
  chart:
    spec:
      chart: strimzi-kafka-operator
      version: "0.41.*"
      sourceRef:
        kind: HelmRepository
        name: strimzi
        namespace: flux-system
  values:
    watchNamespaces:
      - staging
      - production
