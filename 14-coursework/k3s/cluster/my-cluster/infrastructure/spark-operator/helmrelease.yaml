apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: spark-operator
  namespace: spark-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: spark-operator
      version: "1.4.*"
      sourceRef:
        kind: HelmRepository
        name: spark-operator
        namespace: flux-system
  values:
    sparkJobNamespaces:
      - staging
      - production
    webhook:
      enable: true
    metrics:
      enable: true
    serviceAccounts:
      spark:
        create: true
