# SparkApplication CR — надається Spark Operator
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: kafka-to-minio
  namespace: staging
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "ghcr.io/YOUR_GITHUB_USERNAME/spark-consumer:latest"
  imagePullPolicy: Always
  mainApplicationFile: local:///opt/spark/work-dir/kafka_to_minio.py
  sparkVersion: "3.5.0"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 5
    onSubmissionFailureRetryInterval: 20
  driver:
    cores: 1
    memory: "512m"
    labels:
      version: 3.5.0
    serviceAccount: spark
    env:
      - name: KAFKA_BOOTSTRAP_SERVERS
        value: "kafka-cluster-kafka-bootstrap.staging:9092"
      - name: KAFKA_TOPIC
        value: "raw-events"
      - name: MINIO_ENDPOINT
        value: "http://minio.staging:9000"
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: rootUser
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: rootPassword
  executor:
    cores: 1
    instances: 1
    memory: "512m"
    labels:
      version: 3.5.0
