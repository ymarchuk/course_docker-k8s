apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-staging
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/my-cluster/apps/staging
  prune: true
  targetNamespace: staging
  dependsOn:
    - name: strimzi-operator
    - name: spark-operator
    - name: cert-manager
    - name: ingress-nginx
