# KafkaTopic CR — надається Strimzi Operator
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: raw-events
  namespace: staging
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  partitions: 2
  replicas: 1
  config:
    retention.ms: 604800000    # 7 днів
    cleanup.policy: delete
    min.insync.replicas: 1
