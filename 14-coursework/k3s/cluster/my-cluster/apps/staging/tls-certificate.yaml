# Self-signed ClusterIssuer
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
# Certificate для staging
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-staging-tls
  namespace: staging
spec:
  secretName: app-staging-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  commonName: "app.staging.local"
  dnsNames:
    - "app.staging.local"
