version: "3.8"

networks:
  pipeline-net:
    driver: bridge

volumes:
  minio-data:
  kafka-data:
  zookeeper-data:

services:

  # ══════════════════════════════════════════════════
  # ZOOKEEPER
  # ══════════════════════════════════════════════════
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    networks: [pipeline-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ══════════════════════════════════════════════════
  # KAFKA
  # ══════════════════════════════════════════════════
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    networks: [pipeline-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Два listener: INTERNAL (між контейнерами) + EXTERNAL (з хосту)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_NUM_PARTITIONS: 2            # ← 2 партиції (по одній на producer)
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ══════════════════════════════════════════════════
  # KAFKA UI — моніторинг
  # ══════════════════════════════════════════════════
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks: [pipeline-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-pipeline
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ══════════════════════════════════════════════════
  # MINIO
  # ══════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: minio
    networks: [pipeline-net]
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web Console
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ══════════════════════════════════════════════════
  # MINIO INIT — створення bucket
  # ══════════════════════════════════════════════════
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    networks: [pipeline-net]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123;
        mc mb --ignore-existing local/events;
        mc mb --ignore-existing local/checkpoints;
        echo '✅ Buckets created: events, checkpoints';
      "

  # ══════════════════════════════════════════════════
  # PRODUCER — NODE 1
  # ══════════════════════════════════════════════════
  producer-node-1:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: producer-node-1
    networks: [pipeline-net]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: raw-events
      NODE_ID: node-1
      SEND_INTERVAL: "1.0"
    restart: unless-stopped

  # ══════════════════════════════════════════════════
  # PRODUCER — NODE 2
  # ══════════════════════════════════════════════════
  producer-node-2:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: producer-node-2
    networks: [pipeline-net]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: raw-events
      NODE_ID: node-2
      SEND_INTERVAL: "1.5"
    restart: unless-stopped

  # ══════════════════════════════════════════════════
  # SPARK — Structured Streaming (Kafka → MinIO)
  # ══════════════════════════════════════════════════
  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-streaming
    networks: [pipeline-net]
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: raw-events
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: events
      TRIGGER_INTERVAL: "30 seconds"
    restart: unless-stopped
